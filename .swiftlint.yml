# SwiftLint configuration for Pinky
# https://github.com/realm/SwiftLint

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - sorted_first_last

excluded:
  - .build
  - DerivedData
  - .swiftpm

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

custom_rules:
  no_singleton_abuse:
    name: "Avoid Singleton Abuse"
    regex: 'static let shared'
    message: "Prefer dependency injection over singletons. NotificationService and ThemeLoader are exceptions."
    severity: warning
